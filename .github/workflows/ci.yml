name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck gcc-arm-none-eabi

      - name: Unit tests
        run: make test

      - name: Static analysis (cppcheck + MISRA C:2012)
        run: make check

      - name: Cross-compile for Cortex-M4
        run: make arm
